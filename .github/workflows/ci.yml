name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Filtre ici uniquement (pas sur pull_request) : un check requis ne doit
    # jamais rester « en attente » parce que la PR n'a touché que de la doc.
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

env:
  # Seuil de couverture (lignes) des tests unitaires de l'API, défini une seule fois.
  COVERAGE_MIN: 75

# Un nouveau push sur une PR annule le run devenu inutile ; sur main on n'annule jamais.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vérifier le formatage (Prettier)
        run: npm run format:check
      - name: Tests unitaires et couverture
        run: npm run test:coverage
      - name: Résumé et seuil de couverture
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          summary=coverage/coverage-summary.json
          lines=$(jq -r '.total.lines.pct' "$summary")
          {
            echo "### Couverture de l'API (Node $NODE_VERSION)"
            echo
            echo "| Métrique | Couverture |"
            echo "|---|---|"
            echo "| Lignes | $lines % |"
            echo "| Instructions | $(jq -r '.total.statements.pct' "$summary") % |"
            echo "| Fonctions | $(jq -r '.total.functions.pct' "$summary") % |"
            echo "| Branches | $(jq -r '.total.branches.pct' "$summary") % |"
            echo
            echo "Seuil sur les lignes : $COVERAGE_MIN %"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v p="$lines" -v min="$COVERAGE_MIN" 'BEGIN { exit !(p < min) }'; then
            echo "::error title=Couverture insuffisante::lignes $lines % < $COVERAGE_MIN %"
            exit 1
          fi

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Tests d'intégration (PostgreSQL)
        run: npm run test:int

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vérifier le formatage (Prettier)
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Conserver le build (artefact front-dist)
        uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist
          retention-days: 7
          if-no-files-found: error
